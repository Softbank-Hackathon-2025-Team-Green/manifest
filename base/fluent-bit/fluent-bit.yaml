apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kube-system
  labels:
    k8s-app: fluent-bit
data:
  # [설정 1] Fluent Bit 메인 설정
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        Off
        Parsers_File  parsers.conf

    @INCLUDE input-kubernetes.conf
    @INCLUDE filter-kubernetes.conf
    @INCLUDE filter-rewrite-tag.conf
    @INCLUDE output-s3.conf

  # [설정 2] 로그 수집 (Input)
  input-kubernetes.conf: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  # [설정 3] 메타데이터 부착 (Filter)
  filter-kubernetes.conf: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

  # [설정 4] Rewrite Tag - 네임스페이스 기반 로그 분리
  filter-rewrite-tag.conf: |
    # 인프라 로그: ingress-nginx와 kourier만
    [FILTER]
        Name                grep
        Match               kube.*
        Regex               kubernetes_namespace_name ^(ingress-nginx|knative-serving)$

    [FILTER]
        Name                grep
        Match               kube.*
        Regex               kubernetes_pod_name (ingress-nginx-controller|3scale-kourier-gateway)

    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        Rule                $kubernetes['namespace_name'] ^(ingress-nginx|knative-serving)$ infra.logs false
        Emitter_Name        infra_rewriter

    # 유저 앱 로그: user-functions 네임스페이스의 Knative Service만
    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        Rule                $kubernetes['namespace_name'] ^user-functions$ app.logs false
        Emitter_Name        app_rewriter

    # app.logs 중에서 serving.knative.dev/service 레이블이 있는 것만 필터링
    [FILTER]
        Name                grep
        Match               app.logs
        Regex               kubernetes_labels_serving.knative.dev/service .

  # [설정 5] S3 전송 (Output)
  output-s3.conf: |
    # 인프라 로그 → cutty-x-infra-log/ingress/ 폴더
    [OUTPUT]
        Name                         s3
        Match                        infra.logs
        bucket                       cutty-x-infra-log
        region                       ap-northeast-2
        total_file_size              1M
        upload_timeout               1m
        use_put_object               On
        s3_key_format                /ingress/%Y/%m/%d/%H/$TAG[1]-$UUID.log

    # 유저 앱 로그 → 기존 컨벤션 유지
    [OUTPUT]
        Name                         s3
        Match                        app.logs
        bucket                       cutty-x-infra-log
        region                       ap-northeast-2
        total_file_size              1M
        upload_timeout               1m
        use_put_object               On
        s3_key_format                /k3s-logs/%Y/%m/%d/%H/$kubernetes['pod_name']-$UUID.log

  # [설정 5] 파서 설정
  parsers.conf: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: kube-system
  labels:
    k8s-app: fluent-bit-logging
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit-logging
  template:
    metadata:
      labels:
        k8s-app: fluent-bit-logging
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.2
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config