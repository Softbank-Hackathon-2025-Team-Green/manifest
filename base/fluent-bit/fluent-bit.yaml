apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kube-system
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        Off
        Parsers_File  parsers.conf
    
    @INCLUDE input-kubernetes.conf
    @INCLUDE filter-kubernetes.conf
    @INCLUDE filter-rewrite-tag.conf
    @INCLUDE output-s3.conf

  input-kubernetes.conf: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  # [수정 1] 백틱 오타 제거
  filter-kubernetes.conf: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

  # [수정 2] grep 플러그인 문법 수정 - flatten된 키 이름 사용
  filter-rewrite-tag.conf: |
    # 1. 인프라 로그 분리 (ingress-nginx 네임스페이스)
    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        Rule                $kubernetes['namespace_name'] ^ingress-nginx$ infra.logs false
        Emitter_Name        ingress_rewriter

    # 2. 인프라 로그 분리 (Knative Gateway - knative-serving 네임스페이스)
    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        Rule                $kubernetes['namespace_name'] ^knative-serving$ infra.logs false
        Emitter_Name        kourier_rewriter

    # 3. 유저 앱 로그 분리 (user-functions 네임스페이스)
    # [FILTER]
    #     Name                rewrite_tag
    #     Match               kube.*
    #     Rule                $kubernetes['namespace_name'] ^user-functions$ app.logs false
    #     Emitter_Name        app_rewriter

    # 4. [수정됨] grep은 flatten된 키 사용: kubernetes_pod_name
    # [FILTER]
    #     Name                grep
    #     Match               infra.logs
    #     Regex               kubernetes_pod_name (ingress-nginx-controller|3scale-kourier-gateway)

    # 5. [수정됨] 레이블 키의 특수문자(. /)는 _로 변환됨
    #    serving.knative.dev/service -> serving_knative_dev_service
    [FILTER]
        Name                grep
        Match               app.logs
        Regex               kubernetes_labels_serving_knative_dev_service .

  # [수정 3] s3_key_format에서 $kubernetes 문법 제거 - $TAG 사용
  output-s3.conf: |
    # 인프라 로그 저장
    [OUTPUT]
        Name                         s3
        Match                        infra.logs
        bucket                       cutty-x-infra-log
        region                       ap-northeast-2
        total_file_size              1M
        upload_timeout               1m
        use_put_object               On
        s3_key_format                /infra/%Y/%m/%d/%H%M%S-$UUID.log

    # 유저 앱 로그 저장
    [OUTPUT]
        Name                         s3
        Match                        app.logs
        bucket                       cutty-x-infra-log
        region                       ap-northeast-2
        total_file_size              1M
        upload_timeout               1m
        use_put_object               On
        s3_key_format                /k3s-logs/%Y/%m/%d/%H%M%S-$UUID.log

  parsers.conf: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: kube-system
  labels:
    k8s-app: fluent-bit-logging
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit-logging
  template:
    metadata:
      labels:
        k8s-app: fluent-bit-logging
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.2
          imagePullPolicy: IfNotPresent
          # [수정 4] 중복 마운트 제거
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
            - name: k3s-logs
              mountPath: /var/lib/rancher/k3s/agent/containerd/
              readOnly: true
            - name: runlog
              mountPath: /run/log
              readOnly: true
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
      # [수정 4] 중복 볼륨 제거
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config
        - name: k3s-logs
          hostPath:
            path: /var/lib/rancher/k3s/agent/containerd/
        - name: runlog
          hostPath:
            path: /run/log