apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kube-system
  labels:
    k8s-app: fluent-bit
data:
  # [설정 1] 메인 설정
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        Off
        Parsers_File  parsers.conf

    @INCLUDE input-kubernetes.conf
    @INCLUDE filter-kubernetes.conf
    @INCLUDE filter-rewrite.conf
    @INCLUDE output-s3.conf

  # [설정 2] 로그 수집
  input-kubernetes.conf: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  # [설정 3] 메타데이터 부착
  filter-kubernetes.conf: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

  # [설정 4] ★ 중요: 태그를 다시 써서(Rewrite) 경로 분기
  # ingress-nginx -> 태그를 'infra.파드이름'으로 변경
  # user-functions -> 태그를 'app.파드이름'으로 변경
  filter-rewrite.conf: |
    [FILTER]
        Name                  rewrite_tag
        Match                 kube.*
        Rule                  $kubernetes['namespace_name'] ^(ingress-nginx)$ infra.$kubernetes['pod_name'] false
        Emitter_Name          infra_stream

    [FILTER]
        Name                  rewrite_tag
        Match                 kube.*
        Rule                  $kubernetes['namespace_name'] ^(user-functions)$ app.$kubernetes['pod_name'] false
        Emitter_Name          app_stream

  # [설정 5] S3 저장 (분기된 태그별로 다른 경로 저장)
  output-s3.conf: |
    # 1. 인프라 로그 (infra.* 태그 수신) -> /infra/... 저장
    [OUTPUT]
        Name                 s3
        Match                infra.*
        bucket               cutty-x-infra-log
        region               ap-northeast-2
        total_file_size      1M
        upload_timeout       1m
        use_put_object       On
        # $TAG[1]은 위에서 만든 파드이름이 됩니다.
        s3_key_format        /infra/%Y/%m/%d/$TAG[1].log

    # 2. 유저 앱 로그 (app.* 태그 수신) -> /k3s-logs/... 저장
    [OUTPUT]
        Name                 s3
        Match                app.*
        bucket               cutty-x-infra-log
        region               ap-northeast-2
        total_file_size      1M
        upload_timeout       1m
        use_put_object       On
        s3_key_format        /k3s-logs/%Y/%m/%d/$TAG[1].log

  parsers.conf: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: kube-system
  labels:
    k8s-app: fluent-bit-logging
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit-logging
  template:
    metadata:
      labels:
        k8s-app: fluent-bit-logging
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.2
          imagePullPolicy: IfNotPresent
          # [수정 4] 중복 마운트 제거
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
            - name: k3s-logs
              mountPath: /var/lib/rancher/k3s/agent/containerd/
              readOnly: true
            - name: runlog
              mountPath: /run/log
              readOnly: true
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
      # [수정 4] 중복 볼륨 제거
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config
        - name: k3s-logs
          hostPath:
            path: /var/lib/rancher/k3s/agent/containerd/
        - name: runlog
          hostPath:
            path: /run/log