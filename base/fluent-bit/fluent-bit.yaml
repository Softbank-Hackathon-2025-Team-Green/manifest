apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kube-system
  labels:
    k8s-app: fluent-bit
data:
  # [설정 1] Fluent Bit 메인 설정
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        Off
        Parsers_File  parsers.conf

    @INCLUDE input-kubernetes.conf
    @INCLUDE filter-kubernetes.conf
    @INCLUDE filter-rewrite-tag.conf
    @INCLUDE output-s3.conf

  # [설정 2] 로그 수집 (Input)
  input-kubernetes.conf: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  # [설정 3] 메타데이터 부착 (Filter)
  filter-kubernetes.conf: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

  # [설정 4] Rewrite Tag & Routing (핵심 수정 구간)
  filter-rewrite-tag.conf: |
    # 1. 인프라 로그 분리 (ingress-nginx 네임스페이스)
    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        # 네임스페이스가 ingress-nginx이면 infra.logs 태그로 변경
        Rule                $kubernetes['namespace_name'] ^ingress-nginx$ infra.logs false
        Emitter_Name        ingress_rewriter

    # 2. 인프라 로그 분리 (Knative Gateway - knative-serving 네임스페이스)
    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        Rule                $kubernetes['namespace_name'] ^knative-serving$ infra.logs false
        Emitter_Name        kourier_rewriter

    # 3. 유저 앱 로그 분리 (user-functions 네임스페이스)
    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        Rule                $kubernetes['namespace_name'] ^user-functions$ app.logs false
        Emitter_Name        app_rewriter

    # 4. [수정됨] 인프라 로그 중 특정 파드만 남기기 (키 접근 문법 수정)
    [FILTER]
        Name                grep
        Match               infra.logs
        # kubernetes_pod_name (X) -> $kubernetes['pod_name'] (O)
        Regex               $kubernetes['pod_name'] (ingress-nginx-controller|3scale-kourier-gateway)

    # 5. [수정됨] 앱 로그 중 Knative Service만 남기기 (키 접근 문법 수정)
    [FILTER]
        Name                grep
        Match               app.logs
        # kubernetes_labels_... (X) -> $kubernetes['labels']['serving.knative.dev/service'] (O)
        # 레이블 키에 슬래시(/)나 점(.)이 있으면 괄호 표기법이 안전합니다.
        Regex               $kubernetes['labels']['serving.knative.dev/service'] .

  # [설정 5] S3 전송 (Output)
  output-s3.conf: |
    # 인프라 로그 저장
    [OUTPUT]
        Name                         s3
        Match                        infra.logs
        bucket                       cutty-x-infra-log
        region                       ap-northeast-2
        total_file_size              1M
        upload_timeout               1m
        use_put_object               On
        # $TAG[1] 대신 명확한 파드 이름 사용 권장
        s3_key_format                /ingress/%Y/%m/%d/$kubernetes['pod_name']-$UUID.log

    # 유저 앱 로그 저장
    [OUTPUT]
        Name                         s3
        Match                        app.logs
        bucket                       cutty-x-infra-log
        region                       ap-northeast-2
        total_file_size              1M
        upload_timeout               1m
        use_put_object               On
        # 여기도 파드 이름으로 명확하게 지정
        s3_key_format                /k3s-logs/%Y/%m/%d/$kubernetes['pod_name']-$UUID.log

  # [설정 6] 파서 설정
  parsers.conf: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: kube-system
  labels:
    k8s-app: fluent-bit-logging
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit-logging
  template:
    metadata:
      labels:
        k8s-app: fluent-bit-logging
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.2
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config