apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ingress-nginx

resources:
  # namespace.yaml removed - baremetal deploy.yaml already includes ingress-nginx namespace
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/baremetal/deploy.yaml
  - custom-headers.yaml

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: ingress-nginx-controller
  - path: service-patch.yaml
    target:
      kind: Service
      name: ingress-nginx-controller
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: ingress-nginx-controller

# labels 제거 - Deployment selector는 immutable
# labels:
#   - includeSelectors: false
#     pairs:
#       app.kubernetes.io/part-of: knative-faas-platform
