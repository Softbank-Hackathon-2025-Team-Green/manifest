apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ingress-nginx

resources:
  # namespace.yaml removed - baremetal deploy.yaml already includes ingress-nginx namespace
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/baremetal/deploy.yaml

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: ingress-nginx-controller

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: knative-faas-platform
