apiVersion: v1
kind: ConfigMap
metadata:
  name: polling-agent-config
  namespace: user-functions
  labels:
    app: polling-agent
    app.kubernetes.io/name: polling-agent
    app.kubernetes.io/part-of: knative-faas-platform
data:
  # AWS Configuration
  SQS_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/900253478827/cutty-x-infra-dev-faas-task-queue"
  AWS_REGION: "ap-northeast-2"

  # Amplify Backend Configuration
  AMPLIFY_BACKEND_URL: "https://develop.d3uojfl4y2mazd.amplifyapp.com"

  # Knative Configuration
  KNATIVE_NAMESPACE: "user-functions"

  # Polling Configuration
  POLL_INTERVAL: "10"  # seconds
  
  PYTHONUNBUFFERED: "1"
