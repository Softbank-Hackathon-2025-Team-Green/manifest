apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polling-agent
  namespace: user-functions
  labels:
    app: polling-agent
    app.kubernetes.io/name: polling-agent
    app.kubernetes.io/part-of: knative-faas-platform
rules:
  # Knative Service 생성/업데이트/조회/삭제 권한
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Knative Service status 조회 권한
  - apiGroups: ["serving.knative.dev"]
    resources: ["services/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polling-agent
  namespace: user-functions
  labels:
    app: polling-agent
    app.kubernetes.io/name: polling-agent
    app.kubernetes.io/part-of: knative-faas-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polling-agent
subjects:
  - kind: ServiceAccount
    name: polling-agent
    namespace: user-functions
