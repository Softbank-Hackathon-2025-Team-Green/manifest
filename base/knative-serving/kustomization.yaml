apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knative-serving

resources:
  # CRDs는 별도로 설치: kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.20.0/serving-crds.yaml
  # Core만 kustomize로 관리
  - https://github.com/knative/serving/releases/download/knative-v1.20.0/serving-core.yaml

patches:
  - path: config-domain.yaml
    target:
      kind: ConfigMap
      name: config-domain
  - patch: |-
      - op: add
        path: /data/runtime-class-name
        value: |
          gvisor: {}
    target:
      kind: ConfigMap
      name: config-deployment

# labels 제거 - Deployment selector는 immutable이므로 label 추가 시 충돌 발생
# labels:
#   - includeSelectors: false
#     pairs:
#       app.kubernetes.io/part-of: knative-faas-platform
