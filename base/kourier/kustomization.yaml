apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knative-serving

resources:
  - https://github.com/knative/net-kourier/releases/download/knative-v1.20.0/kourier.yaml

patchesStrategicMerge:
  - config-network.yaml
  - kourier-service-patch.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: knative-faas-platform
