apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# POC (Proof of Concept) environment
# Minimal setup: Only Knative Serving + Kourier
# - No Nginx Ingress (외부 접근은 클러스터 내부 테스트만)
# - No Polling Agent (수동으로 Knative Service 생성)
# - No ArgoCD (kubectl apply 직접 사용)

resources:
  - ../../base/knative-serving
  - ../../base/kourier
  - ../../base/namespaces

namespace: ""  # Use namespaces from resources
