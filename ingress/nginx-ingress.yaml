apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knative-ingress
  namespace: knative-serving
  labels:
    app.kubernetes.io/name: knative-ingress
    app.kubernetes.io/part-of: knative-faas-platform
  annotations:
    # Use nginx ingress controller
    kubernetes.io/ingress.class: "nginx"

    # Path-based routing with regex
    # Capture pattern: /{userid}/{custompath}
    nginx.ingress.kubernetes.io/use-regex: "true"

    # Rewrite target path
    # /user123/api/hello -> /
    nginx.ingress.kubernetes.io/rewrite-target: /$3

    # Set upstream Host header to route to correct Knative service
    # Host: {userid}.user-functions.svc.cluster.local
    nginx.ingress.kubernetes.io/upstream-vhost: "$1.user-functions.svc.cluster.local"

    # Additional configurations
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Pattern: /{userid}/{custompath}
          # $1 = userid, $2 = /, $3 = custompath
          - path: /([^/]+)(/?)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: kourier-internal
                port:
                  number: 80
